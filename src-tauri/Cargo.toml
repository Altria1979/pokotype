[package]
name = "pokotype"
version = "0.1.0"
description = "Japanese typing practice, from kana to articles"
authors = ["Altria1979"]
license = "Apache-2.0"
repository = "https://github.com/Altria1979/pokotype"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
